ppo:
  clip_epsilon: 0.5
  epochs_per_update: 4
  gamma: 0.99
  gae_lambda: 0.95
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  lr: 3.0e-4
  mini_batch_size: 16

model:
  hidden_dim: 128
  num_heads: 4
  num_layers: 3

environment:
  detection_window: 10.0   # seconds before arrival a vehicle becomes visible
  commit_window: 2.5       # seconds before arrival a tentative plan locks
  episode_duration: 60.0   # wall-clock seconds per training episode

training:
  num_episodes: 50000
  log_interval: 100
  eval_interval: 1000
  checkpoint_interval: 5000
