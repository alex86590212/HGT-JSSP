ppo:
  clip_epsilon: 0.5
  epochs_per_update: 4
  gamma: 0.99
  gae_lambda: 0.95
  value_loss_coef: 0.5
  entropy_coef: 0.01
  max_grad_norm: 0.5
  lr: 3.0e-4
  mini_batch_size: 16

model:
  hidden_dim: 128
  num_heads: 4
  num_layers: 3

environment:
  detection_window: 10.0      # seconds before arrival a vehicle becomes visible, aprox 180m
  commit_window: 2.5          # seconds before arrival a tentative plan locks aprox 30m
  episode_duration: 60.0      # wall-clock seconds per training episode
  penalty_coef: 0.1           # weight of the rescheduling penalty vs waiting objective
  max_proximity_weight: 2.0   # cap on the 1/time_to_arrival proximity weight

training:
  num_episodes: 60000
  log_interval: 25
  eval_interval: 1000
  checkpoint_interval: 5000
  # Rollout episodes are collected in separate single-threaded PROCESSES
  # (not intra-op threads — measured to make the tiny per-op HGT forwards
  # SLOWER, even with OMP_NUM_THREADS matched to --cpus-per-task). Set this
  # to match --cpus-per-task in the sbatch script; keep OMP_NUM_THREADS=1
  # (and the MKL/OPENBLAS/NUMEXPR equivalents) regardless of this value.
  # 1 = plain serial loop, no ProcessPoolExecutor/IPC overhead at all — use
  # this on single-CPU machines.
  num_workers: 1
  # Rollout (data collection) always runs on CPU regardless of this setting —
  # it's ~1000+ tiny SEQUENTIAL forwards per episode, measured ~10x slower on
  # GPU (kernel-launch overhead per tiny call dominates). device only controls
  # where ppo_update's BATCHED forward/backward passes run, which is a good
  # GPU fit (mirrors the offline model). Set to "cpu" if you have no GPU.
  device: cuda
